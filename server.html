<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance Manager</title>
  <style>
    :root {
      --primary:  #2563eb;
      --primary-h: #1d4ed8;
      --success:  #16a34a;
      --error:    #dc2626;
      --warn-bg:  #fefce8;
      --warn-br:  #fde047;
      --warn-txt: #854d0e;
      --border:   #e5e7eb;
      --muted:    #6b7280;
      --bg:       #f3f4f6;
      --card:     #ffffff;
      --text:     #111827;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2.5rem 1rem 4rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container { width: 100%; max-width: 600px; }

    /* ── Header ── */
    .header { text-align: center; margin-bottom: 2.5rem; }
    .header h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -.025em; }
    .header p  { color: var(--muted); margin-top: .35rem; font-size: .925rem; }

    /* ── Progress bar ── */
    .progress {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      margin-bottom: 2rem;
    }
    .prog-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      position: relative;
    }
    .prog-item:not(:last-child)::after {
      content: "";
      position: absolute;
      top: 14px;
      left: 50%;
      width: 100%;
      height: 2px;
      background: var(--border);
      z-index: 0;
    }
    .prog-item.done:not(:last-child)::after { background: var(--success); }

    .prog-circle {
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .75rem;
      font-weight: 700;
      background: var(--border);
      color: var(--muted);
      position: relative;
      z-index: 1;
      flex-shrink: 0;
    }
    .prog-item.active .prog-circle { background: var(--primary); color: #fff; }
    .prog-item.done   .prog-circle { background: var(--success); color: #fff; }

    .prog-label {
      font-size: .7rem;
      color: var(--muted);
      margin-top: .3rem;
      text-align: center;
    }
    .prog-item.active .prog-label { color: var(--primary); font-weight: 600; }
    .prog-item.done   .prog-label { color: var(--success); }

    /* ── Card ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2rem;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .card-title { font-size: 1.2rem; font-weight: 700; margin-bottom: .35rem; }
    .card-desc  { color: var(--muted); font-size: .9rem; line-height: 1.55; margin-bottom: 1.5rem; }

    /* ── Info box ── */
    .info {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 9px;
      padding: .9rem 1.1rem;
      font-size: .83rem;
      color: #1e40af;
      line-height: 1.6;
      margin-bottom: 1.25rem;
    }
    .info strong { display: block; margin-bottom: .4rem; font-size: .87rem; }
    .info ol  { padding-left: 1.2rem; }
    .info li  { margin-bottom: .2rem; }
    .info a   { color: var(--primary); }
    .info code {
      background: #dbeafe;
      padding: .1rem .35rem;
      border-radius: 4px;
      font-family: ui-monospace, monospace;
      font-size: .78rem;
    }

    /* ── Form ── */
    .field { margin-bottom: 1rem; }
    label  { display: block; font-size: .83rem; font-weight: 600; margin-bottom: .35rem; }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: .6rem .85rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: .9rem;
      font-family: inherit;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
      background: #fff;
      color: var(--text);
    }
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
    }
    input[readonly] { background: #f9fafb; color: var(--muted); cursor: default; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      padding: .55rem 1.3rem;
      border-radius: 8px;
      font-size: .875rem;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: background .15s, box-shadow .15s, opacity .15s;
      white-space: nowrap;
    }
    .btn-primary   { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-h); }
    .btn-secondary { background: #fff; color: #374151; border-color: var(--border); }
    .btn-secondary:hover:not(:disabled) { background: #f9fafb; }
    .btn-success   { background: var(--success); color: #fff; }
    .btn-success:hover:not(:disabled) { background: #15803d; }
    .btn:disabled  { opacity: .45; cursor: not-allowed; }

    /* ── Segmented toggle ── */
    .seg-group {
      display: flex;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 1.25rem;
    }
    .seg-btn {
      flex: 1;
      padding: .55rem .75rem;
      font-size: .875rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      background: #fff;
      color: var(--muted);
      transition: background .15s, color .15s;
    }
    .seg-btn + .seg-btn { border-left: 1.5px solid var(--border); }
    .seg-btn.active { background: var(--primary); color: #fff; font-weight: 600; }
    .seg-btn:hover:not(.active) { background: #f9fafb; }

    /* ── Nav row ── */
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.75rem;
    }

    /* ── Alert banners ── */
    .alert {
      padding: .7rem 1rem;
      border-radius: 8px;
      font-size: .84rem;
      margin-top: .9rem;
      display: none;
      line-height: 1.5;
    }
    .alert.error   { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; }
    .alert.success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d; }
    .alert.info    { background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; }
    .alert.warn    { background: var(--warn-bg); border: 1px solid var(--warn-br); color: var(--warn-txt); }

    /* ── Spinner ── */
    .spin {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .65s linear infinite;
      flex-shrink: 0;
    }
    .spin.dark { border-color: rgba(0,0,0,.15); border-top-color: var(--warn-txt); }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── File upload ── */
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: 9px;
      padding: 1.4rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      font-size: .875rem;
      color: var(--muted);
    }
    .upload-zone:hover { border-color: var(--primary); }
    .upload-zone.has-file { border-color: var(--success); background: #f0fdf4; color: var(--success); }
    .upload-zone input { display: none; }

    /* ── Google auth status pill ── */
    .auth-pill {
      display: none;
      align-items: center;
      gap: .6rem;
      padding: .65rem 1rem;
      border-radius: 8px;
      font-size: .85rem;
      margin-top: .75rem;
    }
    .auth-pill.waiting { display: flex; background: var(--warn-bg); border: 1px solid var(--warn-br); color: var(--warn-txt); }
    .auth-pill.done    { display: flex; background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d; }

    /* ── Terminal ── */
    .terminal {
      background: #0f172a;
      color: #94a3b8;
      border-radius: 10px;
      padding: 1.1rem 1.25rem;
      font-family: ui-monospace, "Cascadia Code", "Menlo", monospace;
      font-size: .78rem;
      line-height: 1.65;
      height: 420px;
      overflow-y: auto;
      margin-bottom: 1rem;
    }
    .terminal p { white-space: pre-wrap; word-break: break-all; }
    .terminal .err  { color: #f87171; }
    .terminal .done { color: #4ade80; font-weight: 700; }

    /* ── Section label ── */
    .section-label {
      font-size: .83rem;
      font-weight: 600;
      margin-bottom: .5rem;
      display: block;
    }
  </style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>Finance Manager</h1>
    <p>Connect your accounts and export your spending to Google Sheets.</p>
  </div>

  <div class="progress" id="progress"></div>
  <div id="content"></div>

</div>
<script>
// ── Config ────────────────────────────────────────────────────────────────────
const STEPS = [
  { label: "Monarch" },
  { label: "Spreadsheet" },
  { label: "Run" },
];

let step = 0;
let status = {};
let googleAuthDone = false;
let googlePollTimer = null;
let monarchMode = "login";          // "login" | "csv"
let runEventSource = null;
let monarchModeUserSet = false;     // true once the user has manually picked a tab
let sheetMode   = null; // "existing" | "create" — null means auto-detect from status

// ── Bootstrap ─────────────────────────────────────────────────────────────────
async function init() {
  status = await api("/api/status");
  googleAuthDone = status.google_token;
  renderProgress();
  renderStep();
}

// ── Progress bar ──────────────────────────────────────────────────────────────
function renderProgress() {
  document.getElementById("progress").innerHTML = STEPS.map((s, i) => {
    const cls = i < step ? "done" : i === step ? "active" : "";
    const label = i < step ? "✓" : i + 1;
    return `<div class="prog-item ${cls}">
      <div class="prog-circle">${label}</div>
      <div class="prog-label">${s.label}</div>
    </div>`;
  }).join("");
}

// ── Routing ───────────────────────────────────────────────────────────────────
function renderStep() {
  [renderMonarch, renderSpreadsheet, renderRun][step]();
}
function goNext() { step++; renderProgress(); renderStep(); }
function showLoadingCard() {
  document.getElementById("content").innerHTML = `
    <div class="card" style="display:flex;align-items:center;justify-content:center;gap:.75rem;min-height:180px">
      <span class="spin" style="width:24px;height:24px;border-width:3px;border-color:rgba(37,99,235,.2);border-top-color:var(--primary)"></span>
      <span style="color:var(--muted);font-size:.9rem">Loading…</span>
    </div>`;
}
// Transition from Monarch step → Spreadsheet step:
// shows spinner immediately, does the sheet check, then renders step 2 synchronously.
async function transitionToSpreadsheet() {
  showLoadingCard();
  if (sheetMode === null && status.spreadsheet_id) {
    const check = await post("/api/sheets/check", {});
    if (check.status === "not_found") status.spreadsheet_id = "";
  }
  step++;
  renderProgress();
  renderSpreadsheet();
}
function goBack() {
  if (runEventSource) { runEventSource.close(); runEventSource = null; }
  step--;
  renderProgress();
  renderStep();
}

// ── Utilities ─────────────────────────────────────────────────────────────────
async function api(url, opts) {
  const r = await fetch(url, opts);
  return r.json();
}
function show(id, text, type) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = text;
  el.className = `alert ${type}`;
  el.style.display = "block";
}
function hide(id) {
  const el = document.getElementById(id);
  if (el) el.style.display = "none";
}
function post(url, body) {
  return api(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
}
function setBtn(id, loading, html) {
  const el = document.getElementById(id);
  if (!el) return;
  el.disabled = loading;
  el.innerHTML = loading ? `<span class="spin"></span>${html || "Working…"}` : html;
}

// ── Step 1: Monarch Money ─────────────────────────────────────────────────────
function renderMonarch() {
  const { monarch_session, monarch_email, has_csv } = status;
  // Auto-select csv tab on first render only (user can always switch back)
  if (!monarchModeUserSet && has_csv && !monarch_session) monarchMode = "csv";

  document.getElementById("content").innerHTML = `
    <div class="card">
      <div class="card-title">Monarch Money</div>
      <div class="card-desc">Sign in to pull your transactions live, or upload a CSV export.</div>

      <div class="seg-group">
        <button class="seg-btn ${monarchMode === "login" ? "active" : ""}"
                onclick="setMonarchMode('login')">Login</button>
        <button class="seg-btn ${monarchMode === "csv" ? "active" : ""}"
                onclick="setMonarchMode('csv')">Use CSV file</button>
      </div>

      <!-- Login section -->
      <div style="display:${monarchMode === "login" ? "" : "none"}">
        ${monarch_session ? `
          <div class="alert success" style="display:block">
            Saved session found${monarch_email ? ` · ${monarch_email}` : ""}.
            <a href="#" onclick="showMonarchForm(event)"
               style="margin-left:.5rem; font-weight:600; color:inherit">Re-enter credentials</a>
          </div>
        ` : ""}
        <div id="mm-form" style="display:${monarch_session ? "none" : ""}">
          <div class="field">
            <label>Email</label>
            <input type="email" id="mm-email" placeholder="you@example.com"
                   value="${monarch_email || ""}">
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" id="mm-password" placeholder="Your Monarch password">
          </div>
          <div class="field">
            <label>Two-Factor Code
              <span style="font-weight:400; color:var(--muted); margin-left:.3rem">(if enabled)</span>
            </label>
            <input type="text" id="mm-mfa" placeholder="123456" maxlength="8"
                   inputmode="numeric" autocomplete="one-time-code">
          </div>
        </div>
      </div>

      <!-- CSV section -->
      <div style="display:${monarchMode === "csv" ? "" : "none"}">
        <div class="info">
          <strong>How to export from Monarch Money</strong>
          <ol>
            <li>Go to <a href="https://app.monarchmoney.com/transactions" target="_blank">app.monarchmoney.com/transactions</a></li>
            <li>Click the download icon (⬇) in the top-right corner</li>
            <li>Select <strong>Export as CSV</strong></li>
            <li>Upload the downloaded file below</li>
          </ol>
          Required columns: <code>Date</code>, <code>Merchant</code>, <code>Amount</code>, <code>Category</code>
        </div>
        <div class="upload-zone ${has_csv ? "has-file" : ""}" id="csv-zone"
             onclick="document.getElementById('csv-input').click()">
          <input type="file" id="csv-input" accept=".csv" onchange="uploadCsv(this)">
          <span id="csv-label">
            ${has_csv ? "✓ CSV already uploaded — click to replace" : "📂 Click to upload transactions.csv"}
          </span>
        </div>
      </div>

      <div class="alert" id="mm-alert"></div>

      <div class="nav">
        <span></span>
        <button class="btn btn-primary" id="mm-btn" onclick="submitMonarchStep()">
          ${monarchMode === "login" && !monarch_session ? "Verify &amp; Next →" : "Next →"}
        </button>
      </div>
    </div>`;

  document.getElementById("mm-password")?.addEventListener("keydown", e => {
    if (e.key === "Enter") submitMonarch();
  });
  document.getElementById("mm-mfa")?.addEventListener("keydown", e => {
    if (e.key === "Enter") submitMFA();
  });
}

function setMonarchMode(mode) {
  monarchMode = mode;
  monarchModeUserSet = true;
  renderMonarch();
}

function showMonarchForm(e) {
  e.preventDefault();
  document.getElementById("mm-form").style.display = "";
  const btn = document.getElementById("mm-btn");
  btn.innerHTML = "Verify &amp; Next →";
}

async function uploadCsv(input) {
  const file = input.files[0];
  if (!file) return;
  const fd = new FormData();
  fd.append("file", file);
  const res = await fetch("/api/transactions/upload", { method: "POST", body: fd }).then(r => r.json());
  if (res.status === "ok") {
    status.has_csv = true;
    document.getElementById("csv-label").textContent = `✓ ${file.name} uploaded`;
    document.getElementById("csv-zone").classList.add("has-file");
    hide("mm-alert");
  } else {
    show("mm-alert", res.message || "Upload failed.", "error");
  }
}

async function submitMonarchStep() {
  if (monarchMode === "csv") {
    if (!status.has_csv) { show("mm-alert", "Please upload a CSV file first.", "error"); return; }
    setBtn("mm-btn", true, "Loading…");
    await post("/api/monarch/mode", { mode: "csv" });
    await transitionToSpreadsheet();
    return;
  }
  // Login mode
  await post("/api/monarch/mode", { mode: "login" });
  const form = document.getElementById("mm-form");
  if (!form || form.style.display === "none") {
    // Saved session exists — validate it before proceeding
    setBtn("mm-btn", true, "Verifying…");
    const res = await post("/api/monarch/validate", {});
    if (res.status === "ok") {
      await transitionToSpreadsheet();
    } else {
      // Session expired — clear saved state and drop back to the login form
      status.monarch_session = false;
      status.monarch_email = "";
      renderMonarch();
      show("mm-alert", "Session expired — please log in again.", "warn");
    }
  } else {
    submitMonarch();
  }
}

async function submitMonarch() {
  const email    = document.getElementById("mm-email").value.trim();
  const password = document.getElementById("mm-password").value.trim();
  const mfa      = document.getElementById("mm-mfa")?.value.trim();
  if (!email || !password) { show("mm-alert", "Please fill in both fields.", "error"); return; }

  setBtn("mm-btn", true, "Connecting…");
  hide("mm-alert");

  const res = await post("/api/monarch/login", { email, password });
  if (res.status === "ok") {
    status.monarch_email = email;
    await transitionToSpreadsheet();
  } else if (res.status === "mfa_required") {
    if (mfa) {
      // Code was pre-filled — submit it automatically
      const mfaRes = await post("/api/monarch/mfa", { code: mfa });
      if (mfaRes.status === "ok") {
        status.monarch_email = email;
        await transitionToSpreadsheet();
      } else {
        setBtn("mm-btn", false, "Verify &amp; Next →");
        document.getElementById("mm-mfa").value = "";
        show("mm-alert", mfaRes.message || "Invalid two-factor code.", "error");
        document.getElementById("mm-mfa").focus();
      }
    } else {
      setBtn("mm-btn", false, "Verify &amp; Next →");
      show("mm-alert", "Two-factor authentication required — enter your code above.", "info");
      document.getElementById("mm-mfa").focus();
    }
  } else {
    setBtn("mm-btn", false, "Verify &amp; Next →");
    show("mm-alert", res.message || "Login failed.", "error");
  }
}

// ── Step 2: Spreadsheet ───────────────────────────────────────────────────────
function renderSpreadsheet() {
  const { spreadsheet_id, google_token } = status;
  if (sheetMode === null) sheetMode = spreadsheet_id ? "existing" : "create";

  document.getElementById("content").innerHTML = `
    <div class="card">
      <div class="card-title">Google Spreadsheet</div>
      <div class="card-desc">Choose the spreadsheet where your finance summary will be exported.</div>

      <div class="seg-group">
        <button class="seg-btn ${sheetMode === "create" ? "active" : ""}"
                onclick="setSheetMode('create')">Create new sheet</button>
        <button class="seg-btn ${sheetMode === "existing" ? "active" : ""}"
                onclick="setSheetMode('existing')">Use existing sheet</button>
      </div>

      <!-- Existing sheet section -->
      <div id="existing-section" style="display:${sheetMode === "existing" ? "" : "none"}">
        <div class="info">
          <strong>Where to find your Spreadsheet ID</strong>
          The ID is the long string in the URL between <code>/d/</code> and <code>/edit</code>:<br>
          <code>docs.google.com/spreadsheets/d/<span style="color:#1e40af;font-weight:bold">YOUR_ID_HERE</span>/edit</code>
        </div>
        <div class="field">
          <label>Spreadsheet ID</label>
          <input type="text" id="sid-existing"
                 placeholder=""
                 value="${spreadsheet_id || ""}">
        </div>
      </div>

      <!-- Create new sheet section -->
      <div id="create-section" style="display:${sheetMode === "create" ? "" : "none"}">
        <div class="info">
          <strong>A new spreadsheet will be created for you</strong>
          A "Finance Manager" spreadsheet will be added to your Google Drive.
          ${!google_token
            ? "You'll be asked to authorize Google Sheets access when you click Next."
            : ""}
        </div>
        ${google_token
          ? `<div class="alert success" style="display:block">✓ Google Sheets is connected — ready to create.</div>`
          : ""}
        <div class="auth-pill" id="auth-pill-sheet"></div>
      </div>

      <div class="alert" id="sid-alert"></div>

      <div class="nav">
        <button class="btn btn-secondary" onclick="goBack()">← Back</button>
        <button class="btn btn-primary" id="sid-run-btn" onclick="submitSpreadsheet()">▶ Run</button>
      </div>
    </div>`;

  document.getElementById("sid-existing")?.addEventListener("keydown", e => {
    if (e.key === "Enter") submitSpreadsheet();
  });
}

function setSheetMode(mode) {
  sheetMode = mode;
  renderSpreadsheet();
}

async function submitSpreadsheet() {
  if (sheetMode === "existing") {
    const sid = document.getElementById("sid-existing")?.value.trim();
    if (!sid) { show("sid-alert", "Please enter your Spreadsheet ID.", "error"); return; }
    await post("/api/sheets/save", { spreadsheet_id: sid });
    status.spreadsheet_id = sid;
    goNext();
    return;
  }

  // Create mode: authorize (if needed) → create sheet → run
  setBtn("sid-run-btn", true, "Working…");
  hide("sid-alert");
  try {
    if (!status.google_token) {
      await startGoogleAuth("auth-pill-sheet", null, null);
    }
    const res = await post("/api/sheets/create", {});
    if (res.status !== "ok") throw new Error(res.message || "Failed to create spreadsheet.");
    status.spreadsheet_id = res.spreadsheet_id;
    goNext();
  } catch (err) {
    setBtn("sid-run-btn", false, "▶ Run");
    show("sid-alert", err.message, "error");
  }
}

// ── Google auth (shared, returns Promise) ────────────────────────────────────
function startGoogleAuth(pillId, btnId, onDone) {
  const pill = document.getElementById(pillId);
  const btn  = document.getElementById(btnId);

  return post("/api/google/auth", {}).then(res => {
    if (res.status === "error") {
      if (pill) { pill.style.cssText = "display:flex; background:#fef2f2; border:1px solid #fecaca; color:#b91c1c"; pill.textContent = res.message; }
      throw new Error(res.message);
    }

    const isRedirect = res.status === "redirect";
    let popup = null;

    if (isRedirect) {
      popup = window.open(res.url, "google_auth", "width=600,height=700,top=100,left=100");
      if (pill) { pill.className = "auth-pill waiting"; pill.innerHTML = `<span class="spin dark"></span> Complete authorization in the popup, then return here.`; }
    } else {
      if (pill) { pill.className = "auth-pill waiting"; pill.innerHTML = `<span class="spin dark"></span> A browser tab opened — authorize there, then return here.`; }
    }
    if (btn) btn.disabled = true;

    return new Promise((resolve, reject) => {
      if (googlePollTimer) clearInterval(googlePollTimer);

      function _onAuthDone() {
        clearInterval(googlePollTimer);
        googleAuthDone = true;
        status.google_token = true;
        if (pill) { pill.className = "auth-pill done"; pill.textContent = "✓ Google Sheets connected"; }
        if (btn) { btn.innerHTML = "✓ Connected"; btn.className = "btn btn-success"; btn.disabled = true; }
        if (onDone) onDone();
        resolve();
      }

      if (isRedirect) {
        // Listen for postMessage from the popup callback page
        window.addEventListener("message", e => {
          if (e.origin === location.origin && e.data === "google_auth_done") {
            clearInterval(googlePollTimer);
            // Small delay so the cookie is committed before we poll
            setTimeout(() => _onAuthDone(), 300);
          }
        }, { once: true });

        // Fallback: poll /api/status in case postMessage is blocked
        googlePollTimer = setInterval(async () => {
          const s = await api("/api/status");
          if (s.google_token) {
            if (popup && !popup.closed) popup.close();
            _onAuthDone();
          } else if (popup && popup.closed) {
            clearInterval(googlePollTimer);
            if (pill) { pill.style.cssText = "display:flex; background:#fef2f2; border:1px solid #fecaca; color:#b91c1c"; pill.textContent = "Authorization cancelled. Try again."; }
            if (btn) btn.disabled = false;
            reject(new Error("Authorization cancelled."));
          }
        }, 1500);
      } else {
        // Local dev (InstalledAppFlow): poll /api/google/auth/status
        googlePollTimer = setInterval(async () => {
          const s = await api("/api/google/auth/status");
          if (s.done) {
            _onAuthDone();
          } else if (s.error) {
            clearInterval(googlePollTimer);
            if (pill) { pill.style.cssText = "display:flex; background:#fef2f2; border:1px solid #fecaca; color:#b91c1c"; pill.textContent = s.error; }
            if (btn) btn.disabled = false;
            reject(new Error(s.error));
          }
        }, 1500);
      }
    });
  });
}

// ── Step 3: Run ───────────────────────────────────────────────────────────────
function renderRun() {
  const { google_token, google_configured } = status;
  googleAuthDone = google_token;

  document.getElementById("content").innerHTML = `
    <div class="card">
      ${!google_configured ? `
        <div class="alert error" style="display:block; margin-bottom:1rem">
          <strong>Server not configured:</strong> Google OAuth credentials are missing.
          Set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET, or add credentials.json to the server.
        </div>
      ` : !google_token ? `
        <div style="margin-bottom:1.5rem">
          <span class="section-label">Connect Google Sheets</span>
          <button class="btn btn-secondary" id="gauth-btn-run"
                  onclick="startGoogleAuth('auth-pill-run','gauth-btn-run', onRunAuthDone)">
            🔗 Connect Google Sheets
          </button>
          <div class="auth-pill" id="auth-pill-run"></div>
        </div>
      ` : ""}

      <div id="run-area" style="display:${google_token && google_configured ? "" : "none"}">
        <div class="terminal" id="terminal"></div>
        <div class="nav" id="post-run-nav" style="display:none; margin-top:1rem">
          <button class="btn btn-secondary" onclick="goBack()">← Back</button>
          <a id="sheet-btn" class="btn btn-primary" href="#" target="_blank"
             style="display:none; text-decoration:none">📊 Open Google Spreadsheet</a>
        </div>
      </div>
    </div>`;

  if (google_token && google_configured) {
    runScript();
  }
}

function onRunAuthDone() {
  document.getElementById("run-area").style.display = "";
  runScript();
}

function runScript() {
  if (runEventSource) { runEventSource.close(); runEventSource = null; }
  document.getElementById("post-run-nav").style.display = "none";
  const term = document.getElementById("terminal");
  term.innerHTML = "";

  runEventSource = new EventSource("/api/run");

  runEventSource.onmessage = e => {
    const data = JSON.parse(e.data);
    const p = document.createElement("p");

    if (data.type === "update_last") {
      const last = term.lastElementChild;
      if (last && last.dataset.updateable) {
        last.textContent = data.text;
      } else {
        p.textContent = data.text;
        p.dataset.updateable = "1";
        term.appendChild(p);
      }
      term.scrollTop = term.scrollHeight;
      return;
    } else if (data.type === "line") {
      p.textContent = data.text;
    } else if (data.type === "done") {
      runEventSource.close(); runEventSource = null;
      p.className = "done";
      p.textContent = "✓ Done!";
      term.appendChild(p);
      term.scrollTop = term.scrollHeight;
      const btn = document.getElementById("sheet-btn");
      if (btn) { btn.href = data.url; btn.style.display = ""; }
      document.getElementById("post-run-nav").style.display = "flex";
      step++; renderProgress();
      return;
    } else if (data.type === "error") {
      runEventSource.close(); runEventSource = null;
      p.className = "err";
      p.textContent = "✗ " + data.text;
      term.appendChild(p);
      term.scrollTop = term.scrollHeight;
      document.getElementById("post-run-nav").style.display = "flex";
      return;
    }

    term.appendChild(p);
    term.scrollTop = term.scrollHeight;
  };

  runEventSource.onerror = () => {
    runEventSource.close(); runEventSource = null;
    const p = document.createElement("p");
    p.className = "err";
    p.textContent = "Connection lost.";
    term.appendChild(p);
    document.getElementById("post-run-nav").style.display = "flex";
  };
}

// ── Start ─────────────────────────────────────────────────────────────────────
init();
</script>
