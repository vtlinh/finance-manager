<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance Manager</title>
  <style>
    :root {
      --primary:  #2563eb;
      --primary-h: #1d4ed8;
      --success:  #16a34a;
      --error:    #dc2626;
      --warn-bg:  #fefce8;
      --warn-br:  #fde047;
      --warn-txt: #854d0e;
      --border:   #e5e7eb;
      --muted:    #6b7280;
      --bg:       #f3f4f6;
      --card:     #ffffff;
      --text:     #111827;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2.5rem 1rem 4rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container { width: 100%; max-width: 600px; }

    /* ── Header ── */
    .header { text-align: center; margin-bottom: 2.5rem; }
    .header h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -.025em; }
    .header p  { color: var(--muted); margin-top: .35rem; font-size: .925rem; }

    /* ── Progress bar ── */
    .progress {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      margin-bottom: 2rem;
    }
    .prog-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      position: relative;
    }
    /* connector line */
    .prog-item:not(:last-child)::after {
      content: "";
      position: absolute;
      top: 14px;
      left: 50%;
      width: 100%;
      height: 2px;
      background: var(--border);
      z-index: 0;
    }
    .prog-item.done:not(:last-child)::after { background: var(--success); }
    .prog-item.active:not(:last-child)::after { background: var(--border); }

    .prog-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .75rem;
      font-weight: 700;
      background: var(--border);
      color: var(--muted);
      position: relative;
      z-index: 1;
      flex-shrink: 0;
    }
    .prog-item.active .prog-circle  { background: var(--primary); color: #fff; }
    .prog-item.done   .prog-circle  { background: var(--success); color: #fff; }

    .prog-label {
      font-size: .7rem;
      color: var(--muted);
      margin-top: .3rem;
      text-align: center;
    }
    .prog-item.active .prog-label { color: var(--primary); font-weight: 600; }
    .prog-item.done   .prog-label { color: var(--success); }

    /* ── Card ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2rem;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .card-title { font-size: 1.2rem; font-weight: 700; margin-bottom: .35rem; }
    .card-desc  { color: var(--muted); font-size: .9rem; line-height: 1.55; margin-bottom: 1.5rem; }

    /* ── Info box ── */
    .info {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 9px;
      padding: .9rem 1.1rem;
      font-size: .83rem;
      color: #1e40af;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .info strong { display: block; margin-bottom: .4rem; font-size: .87rem; }
    .info ol     { padding-left: 1.2rem; }
    .info li     { margin-bottom: .2rem; }
    .info a      { color: var(--primary); }
    .info code   {
      background: #dbeafe;
      padding: .1rem .35rem;
      border-radius: 4px;
      font-family: ui-monospace, monospace;
      font-size: .78rem;
    }

    /* ── Form ── */
    .field { margin-bottom: 1rem; }
    label  { display: block; font-size: .83rem; font-weight: 600; margin-bottom: .35rem; }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: .6rem .85rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: .9rem;
      font-family: inherit;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
      background: #fff;
      color: var(--text);
    }
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      padding: .55rem 1.3rem;
      border-radius: 8px;
      font-size: .875rem;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: background .15s, box-shadow .15s, opacity .15s;
      white-space: nowrap;
    }
    .btn-primary   { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-h); }
    .btn-secondary { background: #fff; color: #374151; border-color: var(--border); }
    .btn-secondary:hover { background: #f9fafb; }
    .btn-success   { background: var(--success); color: #fff; }
    .btn-success:hover:not(:disabled) { background: #15803d; }
    .btn:disabled  { opacity: .45; cursor: not-allowed; }

    /* ── Nav row ── */
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.75rem;
    }

    /* ── Alert banners ── */
    .alert {
      padding: .7rem 1rem;
      border-radius: 8px;
      font-size: .84rem;
      margin-top: .9rem;
      display: none;
      line-height: 1.5;
    }
    .alert.error   { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; }
    .alert.success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d; }
    .alert.info    { background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; }
    .alert.warn    { background: var(--warn-bg); border: 1px solid var(--warn-br); color: var(--warn-txt); }

    /* ── Spinner ── */
    .spin {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .65s linear infinite;
      flex-shrink: 0;
    }
    .spin.dark {
      border-color: rgba(0,0,0,.15);
      border-top-color: var(--warn-txt);
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── File upload ── */
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: 9px;
      padding: 1.6rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      font-size: .875rem;
      color: var(--muted);
    }
    .upload-zone:hover { border-color: var(--primary); }
    .upload-zone.has-file {
      border-color: var(--success);
      background: #f0fdf4;
      color: var(--success);
    }
    .upload-zone input { display: none; }

    /* ── Google auth status pill ── */
    .auth-pill {
      display: none;
      align-items: center;
      gap: .6rem;
      padding: .65rem 1rem;
      border-radius: 8px;
      font-size: .85rem;
      margin-top: .75rem;
    }
    .auth-pill.waiting { display: flex; background: var(--warn-bg); border: 1px solid var(--warn-br); color: var(--warn-txt); }
    .auth-pill.done    { display: flex; background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d; }

    /* ── MFA section ── */
    #mfa-block { display: none; margin-top: .75rem; }

    /* ── Terminal ── */
    .terminal {
      background: #0f172a;
      color: #94a3b8;
      border-radius: 10px;
      padding: 1.1rem 1.25rem;
      font-family: ui-monospace, "Cascadia Code", "Menlo", monospace;
      font-size: .78rem;
      line-height: 1.65;
      height: 420px;
      overflow-y: auto;
      margin-bottom: 1rem;
    }
    .terminal p { white-space: pre-wrap; word-break: break-all; }
    .terminal .err  { color: #f87171; }
    .terminal .done { color: #4ade80; font-weight: 700; }

    /* ── Spreadsheet link ── */
    .sheet-link {
      display: none;
      align-items: center;
      gap: .75rem;
      padding: .9rem 1.1rem;
      background: #f0fdf4;
      border: 1.5px solid #86efac;
      border-radius: 10px;
      color: #15803d;
      text-decoration: none;
      font-weight: 600;
      font-size: .9rem;
      transition: background .15s;
    }
    .sheet-link:hover { background: #dcfce7; }
    .sheet-link.visible { display: flex; }
  </style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>Finance Manager</h1>
    <p>Connect your accounts and export your spending to Google Sheets.</p>
  </div>

  <div class="progress" id="progress"></div>
  <div id="content"></div>

</div>
<script>
// ── Config ────────────────────────────────────────────────────────────────────
const STEPS = [
  { label: "Monarch" },
  { label: "Anthropic" },
  { label: "Google" },
  { label: "Spreadsheet" },
  { label: "Run" },
];

let step = 0;
let status = {};
let googleAuthDone = false;
let googlePollTimer = null;

// ── Bootstrap ─────────────────────────────────────────────────────────────────
async function init() {
  status = await api("/api/status");
  renderProgress();
  renderStep();
}

// ── Progress bar ──────────────────────────────────────────────────────────────
function renderProgress() {
  document.getElementById("progress").innerHTML = STEPS.map((s, i) => {
    const cls = i < step ? "done" : i === step ? "active" : "";
    const label = i < step ? "✓" : i + 1;
    return `<div class="prog-item ${cls}">
      <div class="prog-circle">${label}</div>
      <div class="prog-label">${s.label}</div>
    </div>`;
  }).join("");
}

// ── Routing ───────────────────────────────────────────────────────────────────
function renderStep() {
  [renderMonarch, renderAnthropic, renderGoogle, renderSpreadsheet, renderRun][step]();
}
function goNext() { step++; renderProgress(); renderStep(); }
function goBack() { step--; renderProgress(); renderStep(); }

// ── Utilities ─────────────────────────────────────────────────────────────────
async function api(url, opts) {
  const r = await fetch(url, opts);
  return r.json();
}

function show(id, text, type) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = text;
  el.className = `alert ${type}`;
  el.style.display = "block";
}
function hide(id) {
  const el = document.getElementById(id);
  if (el) el.style.display = "none";
}
function post(url, body) {
  return api(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
}
function setBtn(id, loading, html) {
  const el = document.getElementById(id);
  if (!el) return;
  el.disabled = loading;
  el.innerHTML = loading
    ? `<span class="spin"></span>${html || "Working…"}`
    : html;
}

// ── Step 1: Monarch Money ─────────────────────────────────────────────────────
function renderMonarch() {
  document.getElementById("content").innerHTML = `
    <div class="card">
      <div class="card-title">Monarch Money</div>
      <div class="card-desc">Enter your Monarch Money login credentials to pull your transactions.</div>

      <div class="info">
        <strong>ℹ️ Where to find these</strong>
        Use the same email and password you use to log in at
        <a href="https://app.monarchmoney.com" target="_blank">app.monarchmoney.com</a>.
        If two-factor authentication is enabled on your account, you'll be asked
        for your authenticator code after clicking <em>Verify &amp; Next</em>.
      </div>

      <div class="field">
        <label>Email</label>
        <input type="email" id="mm-email" placeholder="you@example.com"
               value="${status.monarch_email_value || ""}">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="mm-password" placeholder="Your Monarch password">
      </div>

      <div id="mfa-block">
        <div class="field">
          <label>Two-Factor Code</label>
          <input type="text" id="mm-mfa" placeholder="123456" maxlength="8"
                 inputmode="numeric" autocomplete="one-time-code">
        </div>
      </div>

      <div class="alert" id="mm-alert"></div>

      <div class="nav">
        <span></span>
        <button class="btn btn-primary" id="mm-btn" onclick="submitMonarch()">Verify &amp; Next →</button>
      </div>
    </div>`;

  if (status.monarch_session) {
    show("mm-alert",
      "An active session is already saved — click Next to continue, or re-enter credentials to refresh it.",
      "success");
    document.getElementById("mm-btn").innerHTML = "Next →";
    document.getElementById("mm-btn").onclick = goNext;
  }

  document.getElementById("mm-password").addEventListener("keydown", e => {
    if (e.key === "Enter") submitMonarch();
  });
}

async function submitMonarch() {
  const email    = document.getElementById("mm-email").value.trim();
  const password = document.getElementById("mm-password").value.trim();
  if (!email || !password) { show("mm-alert", "Please fill in both fields.", "error"); return; }

  setBtn("mm-btn", true, "Connecting…");
  hide("mm-alert");

  const res = await post("/api/monarch/login", { email, password });

  if (res.status === "ok") {
    goNext();
  } else if (res.status === "mfa_required") {
    document.getElementById("mfa-block").style.display = "block";
    document.getElementById("mm-btn").onclick = submitMFA;
    setBtn("mm-btn", false, "Submit Code →");
    show("mm-alert", "Enter the code from your authenticator app.", "info");
    document.getElementById("mm-mfa").focus();
  } else {
    setBtn("mm-btn", false, "Verify &amp; Next →");
    show("mm-alert", res.message || "Login failed.", "error");
  }
}

async function submitMFA() {
  const code = document.getElementById("mm-mfa").value.trim();
  if (!code) { show("mm-alert", "Please enter your 2FA code.", "error"); return; }

  setBtn("mm-btn", true, "Verifying…");
  const res = await post("/api/monarch/mfa", { code });

  if (res.status === "ok") {
    goNext();
  } else {
    setBtn("mm-btn", false, "Submit Code →");
    show("mm-alert", res.message || "Invalid code.", "error");
  }
}

// ── Step 2: Anthropic API Key ─────────────────────────────────────────────────
function renderAnthropic() {
  document.getElementById("content").innerHTML = `
    <div class="card">
      <div class="card-title">Anthropic API Key</div>
      <div class="card-desc">Used to automatically categorize your transactions with Claude AI.</div>

      <div class="info">
        <strong>ℹ️ How to get your API key</strong>
        <ol>
          <li>Go to <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a></li>
          <li>Open <strong>API Keys</strong> in the left sidebar</li>
          <li>Click <strong>Create Key</strong>, give it a name, and copy it</li>
          <li>The key starts with <code>sk-ant-</code></li>
        </ol>
      </div>

      <div class="field">
        <label>API Key</label>
        <input type="password" id="ant-key" placeholder="sk-ant-api03-…"
               value="${status.anthropic_key_value || ""}">
      </div>

      <div class="alert" id="ant-alert"></div>

      <div class="nav">
        <button class="btn btn-secondary" onclick="goBack()">← Back</button>
        <button class="btn btn-primary" onclick="submitAnthropic()">Next →</button>
      </div>
    </div>`;

  document.getElementById("ant-key").addEventListener("keydown", e => {
    if (e.key === "Enter") submitAnthropic();
  });
}

async function submitAnthropic() {
  const key = document.getElementById("ant-key").value.trim();
  if (!key) { show("ant-alert", "Please enter your API key.", "error"); return; }
  if (!key.startsWith("sk-ant-")) {
    show("ant-alert", "That doesn't look like an Anthropic key — it should start with sk-ant-.", "error");
    return;
  }
  await post("/api/save", { key: "ANTHROPIC_API_KEY", value: key });
  goNext();
}

// ── Step 3: Google Sheets ─────────────────────────────────────────────────────
function renderGoogle() {
  const hasCreds = status.google_credentials;
  const hasToken = status.google_token;
  googleAuthDone = hasToken;

  document.getElementById("content").innerHTML = `
    <div class="card">
      <div class="card-title">Google Sheets Access</div>
      <div class="card-desc">Authorize the app to read and write your Google Sheet.</div>

      <div class="info">
        <strong>ℹ️ How to create OAuth credentials</strong>
        <ol>
          <li>Go to <a href="https://console.cloud.google.com" target="_blank">console.cloud.google.com</a></li>
          <li>Create or select a project</li>
          <li>Navigate to <strong>APIs &amp; Services → Library</strong> and enable the <strong>Google Sheets API</strong></li>
          <li>Go to <strong>APIs &amp; Services → Credentials</strong></li>
          <li>Click <strong>Create Credentials → OAuth 2.0 Client ID</strong></li>
          <li>Choose <strong>Desktop app</strong> as the application type</li>
          <li>Click <strong>Download JSON</strong> and upload the file below</li>
        </ol>
      </div>

      <div class="field">
        <label>credentials.json</label>
        <div class="upload-zone ${hasCreds ? "has-file" : ""}"
             id="upload-zone"
             onclick="document.getElementById('creds-input').click()">
          <input type="file" id="creds-input" accept=".json" onchange="uploadCreds(this)">
          <span id="upload-label">
            ${hasCreds ? "✓ credentials.json already uploaded — click to replace" : "📂 Click to upload credentials.json"}
          </span>
        </div>
      </div>

      <div id="auth-section" style="${hasCreds ? "" : "display:none"}">
        <div class="field">
          <label>Authorize Google Sheets</label>
          <button class="btn ${hasToken ? "btn-success" : "btn-secondary"}"
                  id="google-btn"
                  onclick="startGoogleAuth()">
            ${hasToken ? "✓ Connected" : "🔗 Connect Google Sheets"}
          </button>
          <div class="auth-pill ${hasToken ? "done" : ""}" id="auth-pill">
            ${hasToken ? "✓ Google Sheets is connected" : ""}
          </div>
        </div>
      </div>

      <div class="alert" id="goog-alert"></div>

      <div class="nav">
        <button class="btn btn-secondary" onclick="goBack()">← Back</button>
        <button class="btn btn-primary" id="goog-next"
                onclick="proceedGoogle()"
                ${hasToken ? "" : "disabled"}>Next →</button>
      </div>
    </div>`;
}

async function uploadCreds(input) {
  const file = input.files[0];
  if (!file) return;
  const fd = new FormData();
  fd.append("file", file);
  const res = await fetch("/api/google/credentials", { method: "POST", body: fd }).then(r => r.json());
  if (res.status === "ok") {
    document.getElementById("upload-label").textContent = `✓ ${file.name} uploaded`;
    document.getElementById("upload-zone").classList.add("has-file");
    document.getElementById("auth-section").style.display = "";
    status.google_credentials = true;
  } else {
    show("goog-alert", res.message || "Upload failed.", "error");
  }
}

async function startGoogleAuth() {
  const res = await post("/api/google/auth", {});
  if (res.status !== "started") { show("goog-alert", "Failed to start OAuth flow.", "error"); return; }

  const pill = document.getElementById("auth-pill");
  pill.className = "auth-pill waiting";
  pill.innerHTML = `<span class="spin dark"></span> A new tab opened — complete authorization there, then return here.`;

  document.getElementById("google-btn").disabled = true;

  if (googlePollTimer) clearInterval(googlePollTimer);
  googlePollTimer = setInterval(async () => {
    const s = await api("/api/google/auth/status");
    if (s.done) {
      clearInterval(googlePollTimer);
      googleAuthDone = true;
      status.google_token = true;
      pill.className = "auth-pill done";
      pill.textContent = "✓ Google Sheets is connected";
      const btn = document.getElementById("google-btn");
      btn.textContent = "✓ Connected";
      btn.className = "btn btn-success";
      btn.disabled = true;
      document.getElementById("goog-next").disabled = false;
    } else if (s.error) {
      clearInterval(googlePollTimer);
      show("goog-alert", s.error, "error");
      document.getElementById("google-btn").disabled = false;
    }
  }, 1500);
}

function proceedGoogle() {
  if (!googleAuthDone) { show("goog-alert", "Please complete Google authorization first.", "warn"); return; }
  goNext();
}

// ── Step 4: Spreadsheet ID ────────────────────────────────────────────────────
function renderSpreadsheet() {
  document.getElementById("content").innerHTML = `
    <div class="card">
      <div class="card-title">Google Spreadsheet ID</div>
      <div class="card-desc">The ID of the Google Sheet where your finance summary will be exported.</div>

      <div class="info">
        <strong>ℹ️ Where to find your Spreadsheet ID</strong>
        Open your Google Sheet. The ID is the long string of characters in the URL:
        <br><br>
        <code>docs.google.com/spreadsheets/d/<strong style="color:#1e40af">YOUR_ID_HERE</strong>/edit</code>
        <br><br>
        Don't have a sheet yet? Create one at
        <a href="https://sheets.new" target="_blank">sheets.new</a> — the ID will appear in its URL.
      </div>

      <div class="field">
        <label>Spreadsheet ID</label>
        <input type="text" id="sid" placeholder="1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgVE2upms"
               value="${status.spreadsheet_id_value || ""}">
      </div>

      <div class="alert" id="sid-alert"></div>

      <div class="nav">
        <button class="btn btn-secondary" onclick="goBack()">← Back</button>
        <button class="btn btn-primary" onclick="submitSpreadsheet()">Next →</button>
      </div>
    </div>`;

  document.getElementById("sid").addEventListener("keydown", e => {
    if (e.key === "Enter") submitSpreadsheet();
  });
}

async function submitSpreadsheet() {
  const sid = document.getElementById("sid").value.trim();
  if (!sid) { show("sid-alert", "Please enter your Spreadsheet ID.", "error"); return; }
  await post("/api/save", { key: "SPREADSHEET_ID", value: sid });
  goNext();
}

// ── Step 5: Run ───────────────────────────────────────────────────────────────
function renderRun() {
  document.getElementById("content").innerHTML = `
    <div class="card">
      <div class="card-title">Run Finance Manager</div>
      <div class="card-desc">
        Everything is configured. Click <strong>Run</strong> to fetch transactions,
        categorize them with Claude AI, and export the results to your Google Sheet.
      </div>

      <div id="pre-run" class="nav">
        <button class="btn btn-secondary" onclick="goBack()">← Back</button>
        <button class="btn btn-primary" id="run-btn" onclick="runScript()">▶ Run</button>
      </div>

      <div id="run-area" style="display:none">
        <div class="terminal" id="terminal"></div>
        <a class="sheet-link" id="sheet-link" target="_blank">
          📊 Open Google Spreadsheet →
        </a>
        <div class="nav" id="post-run-nav" style="display:none; margin-top:1rem;">
          <button class="btn btn-secondary" onclick="goBack()">← Back</button>
          <button class="btn btn-primary" onclick="runScript()">▶ Run Again</button>
        </div>
      </div>
    </div>`;
}

function runScript() {
  document.getElementById("pre-run").style.display = "none";
  document.getElementById("run-area").style.display = "";
  document.getElementById("sheet-link").classList.remove("visible");
  document.getElementById("post-run-nav").style.display = "none";
  const term = document.getElementById("terminal");
  term.innerHTML = "";

  const es = new EventSource("/api/run");

  es.onmessage = e => {
    const data = JSON.parse(e.data);
    const p = document.createElement("p");

    if (data.type === "line") {
      p.textContent = data.text;
    } else if (data.type === "done") {
      es.close();
      p.className = "done";
      p.textContent = "✓ Done!";
      term.appendChild(p);
      term.scrollTop = term.scrollHeight;
      const link = document.getElementById("sheet-link");
      link.href = data.url;
      link.classList.add("visible");
      document.getElementById("post-run-nav").style.display = "flex";
      return;
    } else if (data.type === "error") {
      es.close();
      p.className = "err";
      p.textContent = "✗ " + data.text;
      term.appendChild(p);
      term.scrollTop = term.scrollHeight;
      document.getElementById("post-run-nav").style.display = "flex";
      return;
    }

    term.appendChild(p);
    term.scrollTop = term.scrollHeight;
  };

  es.onerror = () => {
    es.close();
    const p = document.createElement("p");
    p.className = "err";
    p.textContent = "Connection lost.";
    term.appendChild(p);
    document.getElementById("post-run-nav").style.display = "flex";
  };
}

// ── Start ─────────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
