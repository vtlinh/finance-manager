[project]
name = "finance-manager"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "cryptography",
    "flask",
    "google-auth-oauthlib",
    "gspread",
    "gunicorn; sys_platform != 'win32'",
    "monarchmoney",
    "python-dotenv",
]

[project.scripts]
finance-run = "manager.main:main_sync"
finance-server = "server:run"

[tool.hatch.build.targets.wheel]
packages = ["manager"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
